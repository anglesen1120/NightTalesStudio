name: backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # 09.1.5-T1: the build-time OpenAPI generator (09 README D14) boots the Api, which runs
  # AddPersistence and validates the connection string, so every build step needs a parseable value.
  # It is a constant, never a real credential, and the tests never use it: they connect through
  # NTS_TEST_PG (the postgres:17 service container in the integration job).
  ConnectionStrings__Postgres: "Host=127.0.0.1;Database=nighttales;Username=nighttales;Password=ci-openapi-document-generation-placeholder"
  # 09.3.2-T1: the same generator also boots the host's start-up validation, which requires the ES256
  # signing key (secret nts/<env>/api/JWT_SIGNING_KEY). CI has no secret store, so each job generates a
  # throwaway P-256 key per run (step "Design-time ES256 signing key"); no key is ever committed.
  # 09.9.4-T1: the generator also boots the host's `App:PublicOrigin` validation (BD12). The base
  # appsettings.json carries the Development value `http://localhost:4200`, which is not a valid origin
  # outside Development, so every build step needs one; it is a constant, never a real deployment
  # origin. `DataProtection__KekPfxPath`/`DataProtection__KekPfxPassword` are added per job by the
  # "Design-time DP_KEK certificate" step (a throwaway PFX generated per run).
  App__PublicOrigin: "https://ci-openapi-document-generation.invalid"
  # 09.2.6-T3: the same generator boots the Api's e-mail start-up validation, which refuses the committed
  # development address pepper outside Development — `email_messages.to_hash` must be salted with a value the
  # world does not know (09 README BD16). This is a constant, never a real secret, exactly like the
  # connection string and the public origin above; a deployment supplies its own Email__AddressHashPepper.
  Email__AddressHashPepper: "ci-openapi-document-generation-placeholder"

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # 09.3.2-T1: a throwaway ES256 key for the OpenAPI generator, which boots the Api and therefore
      # runs AddNightTalesAuth's ValidateOnStart. Generated per run, so no private key is ever committed.
      - name: Design-time ES256 signing key
        shell: bash
        run: |
          {
            echo 'Auth__Jwt__SigningKey<<NTS_SIGNING_KEY_EOF'
            openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256
            echo 'NTS_SIGNING_KEY_EOF'
          } >> "$GITHUB_ENV"
      # 09.9.4-T1: the same generator boots the Api's Data Protection start-up validation, which needs
      # the DP_KEK PFX (secret nts/<env>/shared/DP_KEK). A throwaway RSA PFX is generated per run — RSA
      # because the ring is encrypted with EncryptedXml, which accepts RSA only — and never committed.
      - name: Design-time DP_KEK certificate
        shell: bash
        run: |
          set -euo pipefail
          export KEK_PASSWORD="$(openssl rand -hex 24)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=nts-ci-dp-kek' \
            -keyout "$RUNNER_TEMP/dp-kek.key" -out "$RUNNER_TEMP/dp-kek.crt"
          openssl pkcs12 -export -out "$RUNNER_TEMP/dp-kek.pfx" \
            -inkey "$RUNNER_TEMP/dp-kek.key" -in "$RUNNER_TEMP/dp-kek.crt" -passout env:KEK_PASSWORD
          {
            echo "DataProtection__KekPfxPath=$RUNNER_TEMP/dp-kek.pfx"
            echo "DataProtection__KekPfxPassword=$KEK_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Restore (locked)
        run: dotnet restore NightTales.ci.slnf --locked-mode
      # 09.9.4-T1 (09 README W10): the dependency-vulnerability gate. It runs right after restore, so a
      # vulnerable package fails the fastest job in the pipeline, and the rule lives in a small
      # stdlib-only script (tools/ci/check-vulnerable.py) instead of a shell one-liner, so it is
      # reviewable and its allow-list is time-boxed. The report is not uploaded: it names the package,
      # the version, the severity and the advisory link on stdout.
      - name: Dependency vulnerability gate (high and critical)
        shell: bash
        run: |
          set -euo pipefail
          dotnet list NightTales.ci.slnf package --vulnerable --include-transitive --format json > vulnerable.json
          python3 tools/ci/check-vulnerable.py vulnerable.json
      - name: legal-versions
        run: |
          python3 tools/ci/check-legal-versions.py --selftest
          python3 -m unittest discover -s tests/ci -p 'test_check_legal_versions.py'
          python3 tools/ci/check-legal-versions.py
      - name: Build (Release)
        run: dotnet build NightTales.ci.slnf -c Release --no-restore
      - name: Format check
        run: dotnet format NightTales.ci.slnf --verify-no-changes --no-restore
      # 11.1.2-T1: NightTales.MockMpt.Tests starts the real in-process host, whose CannedMediaSet shells out
      # to `ffmpeg -f lavfi` once to write the two 10 s canned MP4s (tools/mock-mpt/Media/CannedMediaSet.cs).
      # This unit step is the only CI step that runs those tests: they carry no Category trait, so the
      # `integration` and `migrations` jobs (`Category=Integration` / `Category=Migration`) never select them.
      # GitHub's ubuntu-24.04 image has no ffmpeg, so install the same package and flags the mock's own
      # Dockerfile installs in its media stage before the tests run.
      - name: Install ffmpeg (mock canned media)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      # `Category=Node` tests (the real render_check.py, 11.3.5-T3) need the node toolchain and never run in CI.
      # `--minimum-expected-tests 1` is the non-vacuous guard: tests/Directory.Build.props passes
      # `--ignore-exit-code 8`, so a filter that matches nothing prints `total: 0` and still exits 0.
      # The policy violation exits 9 (verified), which is not ignored.
      - name: Unit tests (no database)
        shell: bash
        run: |
          set -o pipefail
          dotnet test NightTales.ci.slnf -c Release --no-build \
            --filter "Category!=Integration&Category!=Node" --minimum-expected-tests 1 2>&1 | tee unit-tests.log
      # `if: always()`: the document is already generated by the Build step, so a red Format or
      # Unit tests step must not swallow it (`if-no-files-found: error` still catches a real miss).
      - name: Upload openapi.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: openapi
          path: src/NightTales.Api/openapi.json
          if-no-files-found: error
          retention-days: 14   # plan §4 UC2
      - name: Upload unit test log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-unit
          path: unit-tests.log
          if-no-files-found: warn
          retention-days: 14   # plan §4 UC2

  integration:
    needs: build-test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # 09 W3 CR-35: PostgresFixture (09.2.1-T2) builds the template database and one database per
      # test class on this server, so NTS_TEST_PG names the maintenance database as superuser.
      NTS_TEST_PG: "Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Design-time ES256 signing key
        shell: bash
        run: |
          {
            echo 'Auth__Jwt__SigningKey<<NTS_SIGNING_KEY_EOF'
            openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256
            echo 'NTS_SIGNING_KEY_EOF'
          } >> "$GITHUB_ENV"
      # 09.9.4-T1: the same generator boots the Api's Data Protection start-up validation, which needs
      # the DP_KEK PFX (secret nts/<env>/shared/DP_KEK). A throwaway RSA PFX is generated per run — RSA
      # because the ring is encrypted with EncryptedXml, which accepts RSA only — and never committed.
      - name: Design-time DP_KEK certificate
        shell: bash
        run: |
          set -euo pipefail
          export KEK_PASSWORD="$(openssl rand -hex 24)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=nts-ci-dp-kek' \
            -keyout "$RUNNER_TEMP/dp-kek.key" -out "$RUNNER_TEMP/dp-kek.crt"
          openssl pkcs12 -export -out "$RUNNER_TEMP/dp-kek.pfx" \
            -inkey "$RUNNER_TEMP/dp-kek.key" -in "$RUNNER_TEMP/dp-kek.crt" -passout env:KEK_PASSWORD
          {
            echo "DataProtection__KekPfxPath=$RUNNER_TEMP/dp-kek.pfx"
            echo "DataProtection__KekPfxPassword=$KEK_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Restore (locked)
        run: dotnet restore NightTales.ci.slnf --locked-mode
      - name: Integration tests (PostgreSQL 17 service)
        shell: bash
        run: |
          set -o pipefail
          dotnet test NightTales.ci.slnf -c Release --no-restore \
            --filter "Category=Integration" --minimum-expected-tests 1 2>&1 | tee integration-tests.log
      - name: Upload integration test log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-integration
          path: integration-tests.log
          if-no-files-found: warn
          retention-days: 14   # plan §4 UC2

  # 09.2.2-T2. A migration that fails on an empty database, fails over the previous schema with data, or
  # leaves the model out of sync is its own job, so the failure names the schema and not "some
  # integration test". The tests carry `Category=Migration`; the database-backed ones also carry
  # `Category=Integration` and therefore run in both this job and the `integration` job — the
  # destructive-operation scan is a unit test and needs no database at all.
  migrations:
    needs: build-test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NTS_TEST_PG: "Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Design-time ES256 signing key
        shell: bash
        run: |
          {
            echo 'Auth__Jwt__SigningKey<<NTS_SIGNING_KEY_EOF'
            openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256
            echo 'NTS_SIGNING_KEY_EOF'
          } >> "$GITHUB_ENV"
      # 09.9.4-T1: the same generator boots the Api's Data Protection start-up validation, which needs
      # the DP_KEK PFX (secret nts/<env>/shared/DP_KEK). A throwaway RSA PFX is generated per run — RSA
      # because the ring is encrypted with EncryptedXml, which accepts RSA only — and never committed.
      - name: Design-time DP_KEK certificate
        shell: bash
        run: |
          set -euo pipefail
          export KEK_PASSWORD="$(openssl rand -hex 24)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=nts-ci-dp-kek' \
            -keyout "$RUNNER_TEMP/dp-kek.key" -out "$RUNNER_TEMP/dp-kek.crt"
          openssl pkcs12 -export -out "$RUNNER_TEMP/dp-kek.pfx" \
            -inkey "$RUNNER_TEMP/dp-kek.key" -in "$RUNNER_TEMP/dp-kek.crt" -passout env:KEK_PASSWORD
          {
            echo "DataProtection__KekPfxPath=$RUNNER_TEMP/dp-kek.pfx"
            echo "DataProtection__KekPfxPassword=$KEK_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Restore (locked)
        run: dotnet restore NightTales.ci.slnf --locked-mode
      - name: Migration tests (PostgreSQL 17 service)
        shell: bash
        run: |
          set -o pipefail
          dotnet test NightTales.ci.slnf -c Release --no-restore \
            --filter "Category=Migration" --minimum-expected-tests 1 2>&1 | tee migration-tests.log
      - name: Upload migration test log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-migration
          path: migration-tests.log
          if-no-files-found: warn
          retention-days: 14   # plan §4 UC2

  # 09.9.5-T1 (09 README BD12/W11; [DECISION 09.9-D3]): the contract gate. It diffs the PR's published
  # `openapi` document against the document generated from the PR's **base commit** and fails an
  # unversioned breaking change — a break inside /api/v1 is acceptable only with a new versioned prefix
  # and a major bump of info.version, which is what `tools/ci/check-version-rule.py` decides.
  #
  # BD12 says "oasdiff breaking against main", but this repository's trunk is `develop`: `main` is
  # frozen at the initial commit (no src/, no NightTales.ci.slnf), so a base build of `main` could
  # never succeed. `github.event.pull_request.base.sha` is the commit the PR is based on — `develop`
  # today — and is fixed for the run, so the comparison does not move under it.
  #
  # It lives in this workflow rather than one of its own because `actions/download-artifact`'s default
  # scope is the current run: a cross-run download would need an API token and a run id for no benefit.
  # It reads only the run's artifact and the PR base, so `contents: read` is all it needs, and it never
  # runs on a push — on a push there is no PR base to compare against.
  contract:
    needs: build-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The artifact is uploaded by `build-test` of this same run; a single-file artifact lands at the
      # root of `head/`. The "Locate the PR's document" step below fails loudly if that ever changes.
      - name: Download the PR's OpenAPI document
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: openapi
          path: head
      - name: Check out the PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: base/global.json
      # The base document is generated by building the PR base in this job, so there is no stored
      # baseline to go stale; the cost is one Api build on PR runs only. The generator boots the Api
      # in-process (09.1.5-T1), so the two throwaway start-up secrets of `build-test` are repeated here.
      - name: Design-time ES256 signing key
        shell: bash
        run: |
          {
            echo 'Auth__Jwt__SigningKey<<NTS_SIGNING_KEY_EOF'
            openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256
            echo 'NTS_SIGNING_KEY_EOF'
          } >> "$GITHUB_ENV"
      - name: Design-time DP_KEK certificate
        shell: bash
        run: |
          set -euo pipefail
          export KEK_PASSWORD="$(openssl rand -hex 24)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=nts-ci-dp-kek' \
            -keyout "$RUNNER_TEMP/dp-kek.key" -out "$RUNNER_TEMP/dp-kek.crt"
          openssl pkcs12 -export -out "$RUNNER_TEMP/dp-kek.pfx" \
            -inkey "$RUNNER_TEMP/dp-kek.key" -in "$RUNNER_TEMP/dp-kek.crt" -passout env:KEK_PASSWORD
          {
            echo "DataProtection__KekPfxPath=$RUNNER_TEMP/dp-kek.pfx"
            echo "DataProtection__KekPfxPassword=$KEK_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Restore the base (locked)
        run: dotnet restore base/NightTales.ci.slnf --locked-mode
      # `dotnet build` of the Api writes the document through the project's own CopyOpenApiDocument
      # target (09.1.5-T1) to base/src/NightTales.Api/openapi.json: the same generation the PR's
      # artifact came from, so the two documents are produced the same way. A broken PR base fails
      # here, with a message that names the base build and not a contract break.
      - name: Build the base and generate its OpenAPI document
        run: dotnet build base/src/NightTales.Api -c Release --no-restore
      - name: Install oasdiff (pinned version + SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          tools/ci/install-oasdiff.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The rule is the arbiter of the gate, so it is exercised on its own before it judges anything:
      # stdlib-only, no oasdiff, no network.
      - name: Self-test the versioning rule
        run: python3 tools/ci/check-version-rule.py --selftest
      # The artifact holds a single file, which upload-artifact roots at its own directory; the path is
      # resolved rather than assumed, so a change in that layout fails here with a message that names
      # the artifact instead of a confusing diff error.
      - name: Locate the PR's document
        shell: bash
        run: |
          set -euo pipefail
          spec="$(find head -type f -name openapi.json -print -quit)"
          if [ -z "$spec" ]; then
            echo "::error::the openapi artifact of this run holds no openapi.json (looked under head/)"
            exit 1
          fi
          echo "HEAD_SPEC=$spec" >> "$GITHUB_ENV"
          echo "head document: $spec"
      # oasdiff exits non-zero on a spec it cannot read, which fails this step with its own message.
      # It is deliberately run WITHOUT `--fail-on`: the rule, not the tool, decides whether an ERR
      # finding is acceptable, and a versioned breaking change has to pass the job.
      - name: Contract diff (oasdiff breaking, JSON findings)
        shell: bash
        run: |
          set -o pipefail
          oasdiff breaking --format json \
            base/src/NightTales.Api/openapi.json "$HEAD_SPEC" | tee findings.json
      - name: Versioning rule
        run: python3 tools/ci/check-version-rule.py findings.json base/src/NightTales.Api/openapi.json "$HEAD_SPEC"
      # Belt and braces next to the unit test that asserts the whole component: a generated client needs
      # the typed error body, so its absence is a failure of its own (09 README D7).
      - name: ProblemDetails component is published
        run: jq -e '.components.schemas.ProblemDetails' "$HEAD_SPEC" > /dev/null
      # `if: always()`: a failed diff must still print what it found — that summary is what the
      # reviewer of the red PR reads.
      - name: Summary
        if: always()
        run: python3 tools/ci/summarize-contract.py findings.json >> "$GITHUB_STEP_SUMMARY"
