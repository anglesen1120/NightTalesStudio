<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NightTales</title>
  </head>
  <body style="margin: 0; padding: 24px; background: #f6f4ef; color: #1f1b16; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.6;">

    <p style="margin: 0 0 16px;">If you did not create an account, ignore this message.</p>

  </body>
</html>
