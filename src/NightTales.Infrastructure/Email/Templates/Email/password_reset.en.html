<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NightTales</title>
  </head>
  <body style="margin: 0; padding: 24px; background: #f6f4ef; color: #1f1b16; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.6;">
    <p style="margin: 0 0 16px;">Hello {{displayName}},</p>
    <p style="margin: 0 0 16px;">Somebody asked to reset the password of this NightTales account. Follow the link below to choose a new one: it works once and expires in {{expiresMinutes}} minutes.</p>
    <p style="margin: 0 0 16px;">{{link}}</p>
    <p style="margin: 0 0 16px;">If this was not you, ignore this message. The current password stays unchanged.</p>
    <p style="margin: 32px 0 0; color: #6b6257; font-size: 13px;">NightTales</p>
  </body>
</html>
