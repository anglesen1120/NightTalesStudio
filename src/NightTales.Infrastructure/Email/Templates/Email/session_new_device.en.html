<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NightTales</title>
  </head>
  <body style="margin: 0; padding: 24px; background: #f6f4ef; color: #1f1b16; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.6;">
    <p style="margin: 0 0 16px;">Hello {{displayName}},</p>
    <p style="margin: 0 0 16px;">This NightTales account was just signed in to from a device we have not seen before: {{device}}, IP address {{ip}}, at {{at}}.</p>
    <p style="margin: 0 0 16px;">If this was not you, change your password and revoke the session at {{securityUrl}}.</p>
    <p style="margin: 32px 0 0; color: #6b6257; font-size: 13px;">NightTales</p>
  </body>
</html>
