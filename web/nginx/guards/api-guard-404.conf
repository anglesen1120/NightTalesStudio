# Prod/default API guard: an API path that reaches the web container is a routing bug
# (the load balancer path rules own /api, /hubs, /health) and must fail fast with a
# non-HTML 404 — the SPA must never answer an API path with HTML. Copied to
# /etc/nginx/conf.d/nts-api-guard.inc by 17-nts-api-guard.sh when NTS_API_UPSTREAM is empty.
# Case-insensitive; matches bare /api, /hubs, /health and anything below them. The
# trailing (/|$) keeps /apix, /healthzz and /hubsx on the SPA; the exact
# `location = /healthz` in default.conf is never swallowed (D5).
location ~* ^/(api|hubs|health)(/|$) {
    default_type text/plain;
    return 404 "not found\n";
}
