<nts-auth-page-shell>
  @if (store.sent()) {
    <nts-auth-state-panel
      titleKey="auth.forgot.sent"
      hintKey="auth.forgot.sentHint"
      actionKey="auth.forgot.back"
      actionHref="/login"
      [announce]="true"
      (navigate)="goToLogin()"
    />
  } @else {
    <nts-forgot-password-form
      [form]="form"
      [submitting]="store.submitting()"
      [canSubmit]="store.canSubmit()"
      [formError]="store.retryAfterSec() === null ? store.formError() : null"
      [retryAfterSec]="store.retryAfterSec()"
      [fieldState]="fieldState()"
      (requestReset)="submit()"
      (retryAfterElapsed)="store.retryAfterElapsed()"
      (backToLogin)="goToLogin()"
    />
  }
</nts-auth-page-shell>
