<nts-auth-page-shell>
  @if (store.done()) {
    <nts-auth-state-panel
      titleKey="auth.reset.success"
      hintKey="auth.reset.successHint"
      actionKey="auth.reset.goToLogin"
      actionHref="/login"
      [announce]="true"
      [success]="true"
      (navigate)="goToLogin()"
    />
  } @else if (!store.hasToken() || store.expired()) {
    <nts-auth-state-panel
      titleKey="auth.reset.missingToken"
      hintKey="auth.reset.missingTokenHint"
      actionKey="auth.reset.requestNew"
      actionHref="/forgot-password"
      (navigate)="goToForgotPassword()"
    />
  } @else {
    <nts-reset-password-form
      [form]="form"
      [submitting]="store.submitting()"
      [canSubmit]="store.canSubmit()"
      [formError]="store.retryAfterSec() === null ? store.formError() : null"
      [mismatch]="store.mismatch()"
      [retryAfterSec]="store.retryAfterSec()"
      [fieldState]="fieldState()"
      (resetPassword)="submit()"
      (retryAfterElapsed)="store.retryAfterElapsed()"
    />
  }
</nts-auth-page-shell>
