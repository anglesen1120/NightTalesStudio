@if (pointerReorder()) {
  <div class="paragraph-list" cdkDropList [cdkDropListData]="paragraphs()" [cdkDropListDisabled]="readOnly()" (cdkDropListDropped)="drop($event)">
    @for (p of paragraphs(); track p.segKey) {
      <nts-paragraph-card cdkDrag [cdkDragData]="p.segKey" [cdkDragDisabled]="readOnly() || p.readOnly"
        [viewModel]="p" [index]="$index" [count]="paragraphs().length" [readOnly]="readOnly()"
        [annotations]="annotationViews().inline.get(p.address) ?? emptyAnnotations" [flaggedChips]="annotationViews().flaggedChips.get(p.address) ?? emptyFlags"
        [similarityLevel]="similarityHighlights().get(p.address) ?? null"
        [limitHit]="keywordLimitHit() === p.segKey" (intent)="forward($event)" />
    }
  </div>
} @else {
  <div class="paragraph-list">
    @for (p of paragraphs(); track p.segKey) {
      <nts-paragraph-card [viewModel]="p" [index]="$index" [count]="paragraphs().length" [readOnly]="readOnly()"
        [annotations]="annotationViews().inline.get(p.address) ?? emptyAnnotations" [flaggedChips]="annotationViews().flaggedChips.get(p.address) ?? emptyFlags"
        [similarityLevel]="similarityHighlights().get(p.address) ?? null"
        [pointerReorder]="false" [limitHit]="keywordLimitHit() === p.segKey" (intent)="forward($event)" />
    }
  </div>
}
