<div class="story-editor">
  <nts-segment-nav [segments]="textSegments()" (openSegment)="open($event)" />
  @if (viewModel().structureWarning) {
    <p class="story-editor__structure-warning" role="status">{{ 'episodes.editor.structureWarning' | transloco }}</p>
  }

  @if (viewModel().formErrors.length > 0) {
    <div class="story-editor__form-errors" role="alert">
      <strong>{{ 'episodes.editor.saveError' | transloco }}</strong>
      <ul>
        @for (errorKey of viewModel().formErrors; track $index) { <li>{{ errorKey | transloco }}</li> }
      </ul>
    </div>
  }

  <section class="story-editor__sheet" [attr.aria-label]="'episodes.editor.manuscript' | transloco">
    <nts-segment-editor
      [viewModel]="viewModel().title"
      [limitHit]="viewModel().keywordLimitHit === viewModel().title.segKey"
      (intent)="forward($event)"
    />
    <nts-segment-editor
      [viewModel]="viewModel().hook"
      [limitHit]="viewModel().keywordLimitHit === viewModel().hook.segKey"
      (intent)="forward($event)"
    />
    <nts-paragraph-list
      [paragraphs]="viewModel().paragraphs"
      [readOnly]="viewModel().readOnly"
      [keywordLimitHit]="viewModel().keywordLimitHit"
      (intent)="forward($event)"
    />
    <nts-segment-editor
      [viewModel]="viewModel().ending"
      [limitHit]="viewModel().keywordLimitHit === viewModel().ending.segKey"
      (intent)="forward($event)"
    />
    <nts-story-meta-editor
      [meta]="viewModel().meta"
      [tokens]="viewModel().metaTokens"
      [readOnly]="viewModel().readOnly"
      [errorKeys]="metaErrors()"
      (intent)="forward($event)"
    />
    <nts-scene-strip [segments]="sceneSegments()" [segmentTexts]="segmentTexts()" />
    <nts-story-save-bar
      [viewModel]="viewModel().saveBar"
      [totalTokens]="viewModel().totalTokens"
      [readOnly]="viewModel().readOnly"
      (intent)="forward($event)"
    />
  </section>
</div>
